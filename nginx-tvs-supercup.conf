# ==============================================================================
# TVS Super Cup 2026-27 - Production Nginx Reverse Proxy Configuration
# Target Domain: tvs.in (supercup.tvs.in & supercup-admin.tvs.in)
# ==============================================================================

# Map connection upgrade for WebSocket / Server-Sent Events telemetry
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Next.js Application Upstream
upstream nextjs_supercup_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ==============================================================================
# 1. DEALER VIEW: https://supercup.tvs.in
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name supercup.tvs.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Dealer Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supercup.tvs.in;

    # SSL Certificates (managed by TVS IT / Let's Encrypt / DigiCert)
    ssl_certificate /etc/ssl/certs/tvs_in_cert.pem;
    ssl_certificate_key /etc/ssl/private/tvs_in_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://nextjs_supercup_upstream;
        proxy_cache_valid 200 365d;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /static/ {
        proxy_pass http://nextjs_supercup_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
    }

    # Main Application Route
    location / {
        proxy_pass http://nextjs_supercup_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Telemetry live ticker support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for streaming & live auction events
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ==============================================================================
# 2. ADMIN VIEW: https://supercup-admin.tvs.in
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name supercup-admin.tvs.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Admin Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supercup-admin.tvs.in;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/tvs_in_cert.pem;
    ssl_certificate_key /etc/ssl/private/tvs_in_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # (OPTIONAL BUT RECOMMENDED) TVS Corporate Network Access Restriction:
    # Uncomment lines below to restrict Admin Console strictly to TVS internal networks / VPN
    # allow 10.0.0.0/8;        # TVS Internal Corporate Network
    # allow 172.16.0.0/12;     # TVS VPN Subnet
    # allow 192.168.0.0/16;    # TVS Office LAN
    # deny all;                # Deny all external internet traffic

    client_max_body_size 20M;

    location / {
        proxy_pass http://nextjs_supercup_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
